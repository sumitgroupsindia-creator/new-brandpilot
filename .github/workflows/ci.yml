name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

  test-api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: brandpilot_test
          MYSQL_USER: brandpilot
          MYSQL_PASSWORD: brandpilot_pass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @brandpilot/api db:generate

      - name: Run migrations
        env:
          DATABASE_URL: mysql://brandpilot:brandpilot_pass@localhost:3306/brandpilot_test
        run: pnpm --filter @brandpilot/api db:migrate:deploy

      - name: Run API tests
        env:
          DATABASE_URL: mysql://brandpilot:brandpilot_pass@localhost:3306/brandpilot_test
          REDIS_URL: redis://localhost:6379
          MASTER_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          JWT_PRIVATE_KEY: "-----BEGIN RSA PRIVATE KEY-----\nMIIEpAIBAAKCAQEAxgNSPM+TDyxKjXtB2ZFJV9tHGDPQSjz8rHc7BYu9+g0TVHBP\\n-----END RSA PRIVATE KEY-----"
          JWT_PUBLIC_KEY: "-----BEGIN PUBLIC KEY-----\\n-----END PUBLIC KEY-----"
          COOKIE_SECRET: test-secret
        run: pnpm --filter @brandpilot/api test
